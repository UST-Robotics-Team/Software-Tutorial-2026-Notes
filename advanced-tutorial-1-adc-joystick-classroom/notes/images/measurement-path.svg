<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250"><rect width="1100" height="250" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#18304e} .title{font-size:25px;font-weight:bold}.label{font-size:19px}.small{font-size:15px}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#4976a8"/></marker></defs><text x="35" y="42" class="title">A measurement has several different meanings</text><rect x="30" y="85" width="185" height="95" rx="12" fill="white" stroke="#9bb5d2"/><text x="122" y="123" text-anchor="middle" class="label">Stick</text><text x="122" y="153" text-anchor="middle" class="small">Mechanical position</text><path d="M217 132H242" stroke="#4976a8" stroke-width="3" marker-end="url(#arrow)"/><rect x="248" y="85" width="185" height="95" rx="12" fill="white" stroke="#9bb5d2"/><text x="340" y="123" text-anchor="middle" class="label">Potentiometer</text><text x="340" y="153" text-anchor="middle" class="small">Analog voltage</text><path d="M435 132H460" stroke="#4976a8" stroke-width="3" marker-end="url(#arrow)"/><rect x="466" y="85" width="185" height="95" rx="12" fill="white" stroke="#9bb5d2"/><text x="558" y="123" text-anchor="middle" class="label">ADC</text><text x="558" y="153" text-anchor="middle" class="small">Integer code</text><path d="M653 132H678" stroke="#4976a8" stroke-width="3" marker-end="url(#arrow)"/><rect x="684" y="85" width="185" height="95" rx="12" fill="white" stroke="#9bb5d2"/><text x="776" y="123" text-anchor="middle" class="label">Memory</text><text x="776" y="153" text-anchor="middle" class="small">Stored sample</text><path d="M871 132H896" stroke="#4976a8" stroke-width="3" marker-end="url(#arrow)"/><rect x="902" y="85" width="185" height="95" rx="12" fill="white" stroke="#9bb5d2"/><text x="994" y="123" text-anchor="middle" class="label">Your program</text><text x="994" y="153" text-anchor="middle" class="small">Calibrated meaning</text><text x="35" y="222" class="small">Predict which stage changes when you change a software reference, sequence rank or calibration parameter.</text></svg>