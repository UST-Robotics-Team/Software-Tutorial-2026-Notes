<text x="40" y="665" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#172d46" font-weight="400" text-anchor="start">Startup: calibrate ADC -&gt; start DMA once. Hardware updates the same four-element array.</text>
<text x="40" y="702" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#5b6b7d" font-weight="400" text-anchor="start">The axes are sampled in sequence; this diagram does not imply a simultaneous four-axis snapshot.</text>
